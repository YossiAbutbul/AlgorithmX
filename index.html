<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgorithmX - אלגוריתמים על גרפים</title>
    <meta name="description" content="לימוד אינטראקטיבי של תשעה אלגוריתמים על גרפים, עם הרצה צעד אחר צעד" />
    <meta name="color-scheme" content="light dark" />

    <!-- How the link looks when someone shares it. The image is absolute on purpose:
         a relative one is ignored by every crawler that reads these. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AlgorithmX" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://algorithmx.abyossi22.workers.dev/" />
    <meta property="og:title" content="AlgorithmX - אלגוריתמים על גרפים" />
    <meta
      property="og:description"
      content="לימוד אינטראקטיבי של תשעה אלגוריתמים על גרפים, עם הרצה צעד אחר צעד"
    />
    <meta property="og:image" content="https://algorithmx.abyossi22.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AlgorithmX, אלגוריתמים על גרפים" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AlgorithmX - אלגוריתמים על גרפים" />
    <meta
      name="twitter:description"
      content="לימוד אינטראקטיבי של תשעה אלגוריתמים על גרפים, עם הרצה צעד אחר צעד"
    />
    <meta name="twitter:image" content="https://algorithmx.abyossi22.workers.dev/og.png" />
    <meta name="theme-color" content="#eef1fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e1c" media="(prefers-color-scheme: dark)" />
    <script>
      /* Stamp the theme before the first paint, so a dark reader never sees a white flash. */
      (function () {
        try {
          var saved = localStorage.getItem('algorithmx:theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
